# Builds and publishes the Docker image for every version tag.
#
# To release: set "version" in package.json and the image tag in docker-compose.yml
# to the same number, commit, then:  git tag v0.1.0 && git push origin v0.1.0
# The image lands at ghcr.io/fulcrum-enterprises/proofledger-community:<version>,
# :<major>.<minor> and :latest, for linux/amd64 and linux/arm64.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install verify-proof
      - run: npm ci
      - run: npm run scan
      - run: npm test
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fulcrum-enterprises/proofledger-community
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
