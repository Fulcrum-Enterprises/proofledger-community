services:
  proofledger:
    image: ghcr.io/fulcrum-enterprises/proofledger-community:0.1.0
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DB_PATH: /data/proofs.db
    volumes:
      - proofledger-data:/data

volumes:
  proofledger-data:
